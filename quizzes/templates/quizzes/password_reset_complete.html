{% extends 'quizzes/base.html' %}
{% load static %}

{% block title %}Password Updated | Quiznapse{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 440px; margin: 80px auto; padding: 0 20px;">
    
    <!-- Title header -->
    <div style="text-align: center; margin-bottom: 32px;">
        <i class="fas fa-check-circle" style="font-size: 3.5rem; color: var(--success); margin-bottom: 16px;"></i>
        <h2 style="font-size: 1.8rem; font-family: 'Outfit', sans-serif;">Password Updated</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 6px;">Your password has been changed successfully.</p>
    </div>

    <!-- Complete Glass card -->
    <div class="glass-card" style="text-align: center; padding: 32px;">
        <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px;">
            You can now log in using your new credentials. Enjoy taking quizzes!
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">
            Sign In Now <i class="fas fa-sign-in-alt"></i>
        </a>
    </div>
</div>

<style>
    /* Expand content space when sidebar is absent */
    .main-content {
        margin-left: 0 !important;
        padding-top: 20px !important;
    }
</style>
{% endblock %}
